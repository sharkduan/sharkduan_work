# covalent-design-v2 environment scaffold
#
# Task 37 boundary (environment scaffold and lightweight smoke):
# - This file is a scaffold, not a verified lock file.
# - Do not run conda/mamba/pip install as part of Task 37.
# - Do not treat any placeholder version below as source-verified.
#
# Task 38 boundary (source verification and lock strategy):
# - Task 38 must not run conda/mamba/pip install or environment solve.
# - Task 38 must not generate real lock files (conda env export, conda-lock, etc.).
# - Task 38 may record official source URLs and version scope in the
#   source verification table (docs/v2/dependency-source-verification.md).
# - Task 38 may mark rows as verified/blocked/unverified in that table.
# - Task 38 may add or update scaffold comments in this file.
# - Do not change dependency versions based on unverified claims.
#
# Four-layer environment model (documented in 04-v2-dependency-and-environment-spec.md):
#   environment.yml (scaffold) -> source verification (Task 38, manual)
#       -> lock output (future/manual) -> installed environment (future/manual)
#
# ADR 0037 smoke profile vocabulary:
# - lightweight: default CI and Windows-local health check.
# - heavy: opt-in Linux/WSL2 heavy dependency path.
# - cpu is not a v2 smoke profile name.
#
# Windows remains lightweight-only. Heavy dependencies must stay optional and
# inactive until each version, API claim, and license is source-verified.

name: covalent-design-v2

channels:
  - conda-forge
  - defaults
  # UNVERIFIED / Task 38: add only after official install sources are checked.
  # - pytorch
  # - nvidia
  # - pyg

dependencies:
  # Python placeholder.
  # UNVERIFIED / Task 38: source-verify exact Python version before lock output.
  - python=3.10

  # Tooling needed to support later editable install mode.
  # UNVERIFIED / Task 38: source-verify package manager behavior before use.
  - pip

  # Project package install mode placeholder.
  # UNRESOLVED: the repository does not currently contain pyproject.toml,
  # setup.py, or setup.cfg. This placeholder cannot be activated until a
  # later task defines the project package metadata.
  # Task 37 and Task 38 use PYTHONPATH=src (PowerShell: $env:PYTHONPATH='src')
  # instead of an installed package. Editable install mode (pip install -e .)
  # remains a future concern.
  # - pip:
  #     - "-e ."

  # Heavy optional dependency placeholders. Do not uncomment in Task 37 or
  # Task 38. Uncommenting requires source verification and a later task that
  # performs environment solve/install.

  # PyTorch / CUDA, UNVERIFIED / Task 38.
  # Required later for tensor backend, PMDM adapter smoke, and GPU training.
  # Official sources to verify: PyTorch install matrix and NVIDIA CUDA docs.
  # - pytorch=<UNVERIFIED>
  # - pytorch-cuda=<UNVERIFIED>
  # - cuda-toolkit=<UNVERIFIED>

  # RDKit, UNVERIFIED / Task 38.
  # Required later only for heavy-profile chemistry adapters.
  # Official source to verify: RDKit installation documentation.
  # - rdkit=<UNVERIFIED>

  # PMDM-related graph dependencies, UNVERIFIED / Task 38.
  # Required later only for real PMDM adapter smoke.
  # Official sources to verify: PMDM repository environment/license and PyG
  # install matrix for the selected PyTorch/CUDA combination.
  # - pytorch-scatter=<UNVERIFIED>
  # - pytorch-sparse=<UNVERIFIED>
  # - pytorch-cluster=<UNVERIFIED>
  # - pytorch-geometric=<UNVERIFIED>

  # PMDM / PocketFlow source checkouts, UNVERIFIED / Task 38.
  # These are not default dependencies and are not installed by Task 37 or
  # Task 38. Source verification and license status must be recorded in the
  # source verification table before any install path is executed.
  # - pip:
  #     - "-e <PMDM_PATH>"
  #     - "-e <POCKETFLOW_PATH>"

  # Docking engine, NOT REQUIRED YET.
  # Optional feasibility only; no engine is selected in Task 37 or Task 38.
  # - <docking-engine>=<UNVERIFIED>
